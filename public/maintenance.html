<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Sitio en mantenimiento</title>

  <style>
    :root {
      --bg: #f4f2ec;
      --card: #ffffff;
      --text: #1d1d1b;
      --muted: #6d6a63;
      --line: #dedbd2;
      --accent: #b98b4b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(185, 139, 75, 0.14), transparent 32%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 620px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 24px 70px rgba(29, 29, 27, 0.08);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #f2eee6;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    h1 {
      font-size: clamp(30px, 6vw, 48px);
      line-height: 1.05;
      letter-spacing: -0.04em;
      margin-bottom: 18px;
    }

    p {
      max-width: 470px;
      margin: 0 auto;
      font-size: 16px;
      line-height: 1.7;
      color: var(--muted);
    }

    .small {
      margin-top: 30px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: #9a958b;
    }
  </style>
</head>

<body>
  <main>
    <div class="status">
      <span class="dot"></span>
      Mantenimiento administrativo
    </div>

    <h1>Sitio temporalmente no disponible</h1>

    <p>
      Este sitio se encuentra en una revisión administrativa temporal.
      Por favor, vuelve a intentarlo más tarde.
    </p>

    <div class="small">
      Gracias por tu comprensión.
    </div>
  </main>
</body>
</html>
